<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Phishing URL Detector</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <div class="security-icon">
            🛡️
        </div>

        <h1>Phishing URL Detector</h1>

        <p class="subtitle">
            Analyze website URLs and identify suspicious links
        </p>

        <form method="POST">

            <label for="url">
                Enter Website URL
            </label>

            <input
                type="text"
                id="url"
                name="url"
                placeholder="https://example.com"
                required
            >

            <button type="submit">
                Scan URL
            </button>

        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div class="features">

            <div class="feature">
                <div class="feature-icon">🔍</div>
                <p>URL Analysis</p>
            </div>

            <div class="feature">
                <div class="feature-icon">🔐</div>
                <p>Security Check</p>
            </div>

            <div class="feature">
                <div class="feature-icon">⚡</div>
                <p>Instant Result</p>
            </div>

        </div>

    </div>

</div>

</body>
</html>
